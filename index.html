<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Classroom</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" id="favicon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== PASSWORD SCREEN ===== */
        #passwordScreen {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-box .brand-icon {
            font-size: 40px;
            margin-bottom: 6px;
            display: block;
        }
        .login-box h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
        }
        .login-box h1 span {
            color: #888888;
            font-weight: 300;
        }
        .login-box .subtitle {
            color: #555555;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .login-box .divider {
            width: 30px;
            height: 2px;
            background: #ffffff;
            margin: 0 auto 20px;
            opacity: 0.3;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #passwordInput {
            flex: 1;
            min-width: 120px;
            padding: 10px 14px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            outline: none;
            transition: all 0.4s ease;
        }
        #passwordInput:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }
        #passwordInput::placeholder {
            color: #333333;
        }
        #passwordInput.error {
            border-color: #ff3333;
        }

        #unlockBtn {
            padding: 10px 22px;
            font-size: 12px;
            font-weight: 600;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-transform: uppercase;
        }
        #unlockBtn:hover {
            background: #dddddd;
            transform: scale(1.02);
        }

        .error-message {
            margin-top: 10px;
            font-size: 11px;
            font-weight: 500;
            color: #ff3333;
            min-height: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .error-message.show {
            opacity: 1;
        }
        .login-box .footer-text {
            margin-top: 20px;
            font-size: 9px;
            color: #222222;
            letter-spacing: 1px;
        }

        /* ===== DASHBOARD ===== */
        #dashboardScreen {
            display: none;
            position: relative;
            z-index: 1;
            padding: 6px 10px;
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        .dash-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .dash-topbar .brand {
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .dash-topbar .brand span {
            color: #555555;
            font-weight: 300;
        }

        .dash-topbar .right-section {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dash-clock {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 2px 8px;
            text-align: center;
            min-width: 60px;
        }
        .dash-clock .time {
            display: block;
            font-size: 9px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .dash-clock .date {
            display: block;
            font-size: 5px;
            color: #444444;
            font-weight: 400;
        }

        .dash-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
        }

        .proxy-toggle {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 7px;
            color: #888888;
        }
        .proxy-toggle:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .proxy-toggle .proxy-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #444444;
            transition: background 0.3s;
        }
        .proxy-toggle .proxy-dot.active {
            background: #00ff44;
            box-shadow: 0 0 10px rgba(0, 255, 68, 0.2);
        }
        .proxy-toggle .proxy-label.active {
            color: #00ff44;
        }

        /* ===== MAIN LAYOUT - ULTRA COMPACT ===== */
        .main-layout {
            display: grid;
            grid-template-columns: 90px 1fr 200px;
            gap: 5px;
            height: calc(100vh - 52px);
        }

        /* ===== CLOAK PANEL - TINY ===== */
        .cloak-panel {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 5px 5px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }
        .cloak-panel::-webkit-scrollbar {
            width: 2px;
        }
        .cloak-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .cloak-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .cloak-panel .panel-title {
            font-size: 6px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 3px;
            padding-bottom: 3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .cloak-option {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 2px 4px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cloak-option:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .cloak-option.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .cloak-option .cloak-icon {
            font-size: 10px;
            width: 14px;
            text-align: center;
        }
        .cloak-option .cloak-name {
            font-size: 7px;
            font-weight: 500;
            color: #ffffff;
        }
        .cloak-option .cloak-check {
            color: #00ff44;
            font-size: 7px;
            opacity: 0;
            margin-left: auto;
        }
        .cloak-option.active .cloak-check {
            opacity: 1;
        }
        .cloak-option .cloak-status-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #444444;
            margin-left: auto;
        }
        .cloak-option.active .cloak-status-dot {
            background: #00ff44;
        }

        /* ===== CENTER - COMPACT ===== */
        .center-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
            gap: 4px;
        }
        .center-content::-webkit-scrollbar {
            width: 2px;
        }
        .center-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .center-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .welcome-banner {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 4px 10px;
            flex-shrink: 0;
        }
        .welcome-banner h2 {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
        }
        .welcome-banner h2 span {
            color: #666666;
            font-weight: 300;
        }
        .welcome-banner p {
            color: #555555;
            font-size: 7px;
            margin-top: 1px;
        }
        .welcome-banner p strong {
            color: #ffffff;
        }

        /* ===== CALCULATOR - SUPER COMPACT ===== */
        .calculator-modern {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 4px 6px;
            flex-shrink: 0;
            max-height: 170px;
        }

        .calculator-modern .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .calculator-modern .calc-header .calc-label {
            font-size: 6px;
            font-weight: 600;
            color: #555555;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .calculator-modern .calc-header .calc-mode {
            font-size: 5px;
            color: #333333;
            background: rgba(255, 255, 255, 0.03);
            padding: 0px 4px;
            border-radius: 4px;
        }

        .calc-display-modern {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            padding: 2px 8px;
            text-align: right;
            margin-bottom: 3px;
            min-height: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .calc-display-modern .calc-expr {
            font-size: 8px;
            color: #666666;
            font-weight: 300;
            min-height: 10px;
            font-family: 'Courier New', monospace;
        }
        .calc-display-modern .calc-result {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            min-height: 18px;
            font-family: 'Courier New', monospace;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }

        .calc-btn-modern {
            padding: 2px 1px;
            font-size: 9px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff;
            cursor: pointer;
            transition: all 0.12s ease;
            font-family: inherit;
            text-align: center;
            min-height: 18px;
            line-height: 1;
        }
        .calc-btn-modern:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }
        .calc-btn-modern:active {
            transform: scale(0.92);
        }
        .calc-btn-modern.op {
            background: rgba(0, 180, 255, 0.12);
            color: #66ddff;
        }
        .calc-btn-modern.op:hover {
            background: rgba(0, 180, 255, 0.2);
        }
        .calc-btn-modern.eq {
            background: #ffffff;
            color: #000000;
            grid-column: span 2;
        }
        .calc-btn-modern.eq:hover {
            background: #dddddd;
        }
        .calc-btn-modern.clr {
            background: rgba(255, 50, 50, 0.12);
            color: #ff6666;
        }
        .calc-btn-modern.clr:hover {
            background: rgba(255, 50, 50, 0.2);
        }
        .calc-btn-modern.fn {
            background: rgba(255, 200, 0, 0.06);
            color: #ffcc44;
            font-size: 7px;
        }
        .calc-btn-modern.fn:hover {
            background: rgba(255, 200, 0, 0.12);
        }
        .calc-btn-modern.zero {
            grid-column: span 2;
        }

        /* ===== PARTY CHAT - COMPACT ===== */
        .party-modern {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 4px 6px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 80px;
        }

        .party-modern .party-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
            flex-shrink: 0;
        }

        .party-modern .party-top .party-title-section {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .party-modern .party-top .party-title-section .party-icon {
            font-size: 10px;
        }
        .party-modern .party-top .party-title-section .party-name {
            font-size: 8px;
            font-weight: 600;
            color: #ffffff;
        }
        .party-modern .party-top .party-title-section .party-count {
            font-size: 6px;
            color: #555555;
            background: rgba(255, 255, 255, 0.04);
            padding: 0px 4px;
            border-radius: 6px;
        }

        .party-modern .party-top .party-actions {
            display: flex;
            gap: 2px;
        }

        .party-btn-modern {
            padding: 1px 6px;
            font-size: 6px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            color: #aaaaaa;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .party-btn-modern:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .party-btn-modern.create {
            background: linear-gradient(135deg, #00cc44, #00aa33);
            color: #000000;
            border-color: transparent;
        }
        .party-btn-modern.create:hover {
            background: linear-gradient(135deg, #00dd55, #00bb44);
        }
        .party-btn-modern.join {
            background: linear-gradient(135deg, #0066ff, #0044dd);
            color: #ffffff;
            border-color: transparent;
        }
        .party-btn-modern.join:hover {
            background: linear-gradient(135deg, #0077ff, #0055ee);
        }
        .party-btn-modern.leave {
            background: rgba(255, 50, 50, 0.15);
            color: #ff6666;
            border-color: rgba(255, 50, 50, 0.2);
        }
        .party-btn-modern.leave:hover {
            background: rgba(255, 50, 50, 0.25);
        }

        .party-code-modern {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 1px 6px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 2px;
            flex-shrink: 0;
        }
        .party-code-modern .pc-label {
            font-size: 5px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .party-code-modern .pc-code {
            font-size: 11px;
            font-weight: 700;
            color: #44ff88;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }
        .party-code-modern .pc-copy {
            padding: 0px 4px;
            font-size: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            color: #666666;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .party-code-modern .pc-copy:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .party-msgs-modern {
            flex: 1;
            overflow-y: auto;
            padding: 2px 2px;
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-height: 20px;
            max-height: 45px;
        }
        .party-msgs-modern::-webkit-scrollbar {
            width: 2px;
        }
        .party-msgs-modern::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .party-msgs-modern::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .party-msg-modern {
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 7px;
            line-height: 1.2;
            word-wrap: break-word;
            max-width: 95%;
        }
        .party-msg-modern.sys {
            background: rgba(255, 255, 255, 0.02);
            color: #555555;
            text-align: center;
            font-style: italic;
            align-self: center;
            font-size: 6px;
        }
        .party-msg-modern.me {
            background: rgba(68, 200, 255, 0.12);
            color: #88ddff;
            align-self: flex-end;
        }
        .party-msg-modern.other {
            background: rgba(255, 255, 255, 0.04);
            color: #bbbbbb;
            align-self: flex-start;
        }
        .party-msg-modern .pm-user {
            font-weight: 600;
            color: #ffffff;
            margin-right: 2px;
        }
        .party-msg-modern .pm-time {
            font-size: 5px;
            color: #333333;
            margin-left: 2px;
        }

        .party-input-modern {
            display: flex;
            gap: 2px;
            padding-top: 2px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }
        .party-input-modern input {
            flex: 1;
            padding: 2px 6px;
            font-size: 7px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            outline: none;
            transition: all 0.2s;
        }
        .party-input-modern input:focus {
            border-color: rgba(255, 255, 255, 0.12);
        }
        .party-input-modern input::placeholder {
            color: #333333;
        }
        .party-input-modern button {
            padding: 2px 8px;
            background: linear-gradient(135deg, #ffffff, #eeeeee);
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 7px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .party-input-modern button:hover {
            transform: scale(1.05);
        }
        .party-input-modern button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== CHAT SIDEBAR - COMPACT ===== */
        .chat-sidebar {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            width: 200px;
        }

        .chat-header {
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .chat-header .chat-icon {
            font-size: 10px;
        }
        .chat-header .chat-title {
            font-size: 8px;
            font-weight: 600;
            color: #ffffff;
        }
        .chat-header .chat-status {
            font-size: 5px;
            color: #00ff44;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .chat-header .chat-status::before {
            content: '';
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #00ff44;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 4px 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .chat-messages::-webkit-scrollbar {
            width: 2px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .message {
            max-width: 92%;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 8px;
            line-height: 1.3;
            animation: fadeInUp 0.3s ease;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.bot {
            background: rgba(255, 255, 255, 0.06);
            color: #dddddd;
            align-self: flex-start;
        }
        .message.user {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            align-self: flex-end;
        }
        .message .msg-time {
            font-size: 5px;
            color: #444444;
            margin-top: 2px;
            display: block;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            gap: 2px;
        }
        .typing-indicator span {
            width: 4px;
            height: 4px;
            background: #666666;
            border-radius: 50%;
            display: inline-block;
            animation: typingBounce 1.4s infinite;

    <script>
        // ============================================
        // PROXY TOGGLE
        // ============================================
        let proxyActive = false;
        document.getElementById('proxyToggle').addEventListener('click', function() {
            proxyActive = !proxyActive;
            const dot = document.getElementById('proxyDot');
            const label = document.getElementById('proxyLabel');
            if (proxyActive) {
                dot.className = 'proxy-dot active';
                label.textContent = 'Proxy: ON';
                label.className = 'proxy-label active';
            } else {
                dot.className = 'proxy-dot';
                label.textContent = 'Proxy: OFF';
                label.className = 'proxy-label';
            }
        });

        // ============================================
        // TAB CLOAK
        // ============================================
        const cloakOptions = document.querySelectorAll('.cloak-option');
        const currentCloakDisplayName = document.getElementById('currentCloakDisplayName');
        const faviconLink = document.getElementById('favicon');

        function applyCloak(cloakName, tabTitle, faviconPath) {
            document.title = tabTitle;
            if (faviconPath) faviconLink.href = faviconPath;
            currentCloakDisplayName.textContent = cloakName;
            cloakOptions.forEach(opt => {
                opt.classList.remove('active');
                if (opt.dataset.cloak === cloakName) opt.classList.add('active');
            });
        }

        cloakOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                applyCloak(opt.dataset.cloak, opt.dataset.tab, opt.dataset.favicon);
            });
        });

        // ============================================
        // PARTICLES
        // ============================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouseX = 0,
            mouseY = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                const dx = mouseX - this.x,
                    dy = mouseY - this.y,
                    dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150) {
                    const force = (150 - dist) / 150 * 0.02;
                    this.x += dx * force;
                    this.y += dy * force;
                }
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        const particleCount = Math.min(80, Math.floor((window.innerWidth * window.innerHeight) / 10000));
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update();
                p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        document.addEventListener('mousemove', (e) => { mouseX = e.clientX;
            mouseY = e.clientY; });

        // ============================================
        // PASSWORD
        // ============================================
        const CORRECT_PASSWORD = "2026";
        const passwordScreen = document.getElementById('passwordScreen');
        const dashboardScreen = document.getElementById('dashboardScreen');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMessage = document.getElementById('errorMessage');

        function checkPassword() {
            const entered = passwordInput.value.trim();
            if (entered === CORRECT_PASSWORD) {
                passwordScreen.style.display = 'none';
                dashboardScreen.style.display = 'block';
                errorMessage.classList.remove('show');
                updateClock();
                setInterval(updateClock, 1000);
                const firstCloak = document.querySelector('.cloak-option.active');
                if (firstCloak) {
                    applyCloak(firstCloak.dataset.cloak, firstCloak.dataset.tab, firstCloak.dataset.favicon);
                }
                setTimeout(() => { document.getElementById('chatInput').focus(); }, 500);
            } else {
                errorMessage.textContent = '✗ Invalid passcode. Try again.';
                errorMessage.classList.add('show');
                passwordInput.classList.add('error');
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => { passwordInput.classList.remove('error'); }, 500);
            }
        }

        unlockBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                checkPassword(); } });
        window.addEventListener('load', () => { passwordInput.focus(); });

        // ============================================
        // CLOCK
        // ============================================
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clockTime').textContent = `${h}:${m}:${s}`;
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            document.getElementById('clockDate').textContent =
                `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
        }

        // ============================================
        // CALCULATOR
        // ============================================
        let calcExpression = '';
        let calcResult = '0';

        function updateCalcDisplay() {
            document.getElementById('calcExpression').textContent = calcExpression;
            document.getElementById('calcResult').textContent = calcResult || '0';
        }

        function handleCalcInput(value) {
            if (value === 'clear') {
                calcExpression = '';
                calcResult = '0';
                updateCalcDisplay();
                return;
            }

            if (value === '=') {
                try {
                    let evalExpr = calcExpression
                        .replace(/×/g, '*')
                        .replace(/÷/g, '/')
                        .replace(/−/g, '-')
                        .replace(/π/g, Math.PI)
                        .replace(/e/g, Math.E)
                        .replace(/sqrt\(/g, 'Math.sqrt(')
                        .replace(/sin\(/g, 'Math.sin(')
                        .replace(/cos\(/g, 'Math.cos(')
                        .replace(/tan\(/g, 'Math.tan(')
                        .replace(/\^2/g, '**2')
                        .replace(/\^3/g, '**3');
                    const result = Function('"use strict"; return (' + evalExpr + ')')();
                    calcResult = String(parseFloat(result.toFixed(10)));
                    calcExpression = '';
                    updateCalcDisplay();
                } catch (e) {
                    calcResult = 'Error';
                    updateCalcDisplay();
                }
                return;
            }

            if (['sqrt', 'sin', 'cos', 'tan', '^', '^3', 'pi', 'e'].includes(value)) {
                const map = { 'sqrt': 'sqrt(', 'sin': 'sin(', 'cos': 'cos(', 'tan': 'tan(', '^': '^2', '^3': '^3', 'pi': 'π',
                    'e': 'e' };
                calcExpression += map[value] || value;
                calcResult = '0';
                updateCalcDisplay();
                return;
            }

            if (calcResult !== '0' && calcExpression === '' && !isNaN(value)) {
                calcResult = '0';
            }
            if (calcResult !== '0' && calcExpression === '' && '+-/*%'.includes(value)) {
                calcExpression = calcResult + value;
                calcResult = '0';
                updateCalcDisplay();
                return;
            }

            calcExpression += value;
            calcResult = '0';
            updateCalcDisplay();
        }

        document.querySelectorAll('.calc-btn-modern').forEach(btn => {
            btn.addEventListener('click', () => handleCalcInput(btn.dataset.value));
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key >= '0' && key <= '9') handleCalcInput(key);
            else if (key === '.') handleCalcInput('.');
            else if (key === '+') handleCalcInput('+');
            else if (key === '-') handleCalcInput('-');
            else if (key === '*') handleCalcInput('*');
            else if (key === '/') handleCalcInput('/');
            else if (key === 'Enter' || key === '=') { e.preventDefault();
                handleCalcInput('='); } else if (key === 'Escape' || key === 'c' || key === 'C') handleCalcInput('clear');
        });

        // ============================================
        // PARTY CHAT
        // ============================================
        let partyCode = '';
        let isInParty = false;
        let partyMembers = [];
        let username = 'User' + Math.floor(Math.random() * 1000);
        let broadcastChannel = null;

        const partyMessagesEl = document.getElementById('partyMessages');
        const partyInput = document.getElementById('partyInput');
        const partySendBtn = document.getElementById('partySendBtn');
        const createPartyBtn = document.getElementById('createPartyBtn');
        const joinPartyBtn = document.getElementById('joinPartyBtn');
        const leavePartyBtn = document.getElementById('leavePartyBtn');
        const partyCodeDisplay = document.getElementById('partyCodeDisplay');
        const partyCodeValue = document.getElementById('partyCodeValue');
        const partyMemberCount = document.getElementById('partyMemberCount');
        const copyCodeBtn = document.getElementById('copyCodeBtn');

        function generatePartyCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        function addPartyMessage(text, type, user = '') {
            const msgDiv = document.createElement('div');
            msgDiv.className = `party-msg-modern ${type}`;
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            if (type === 'sys') {
                msgDiv.textContent = text;
            } else if (type === 'me') {
                msgDiv.innerHTML =
                    `<span class="pm-user">You:</span> ${text} <span class="pm-time">${timeStr}</span>`;
            } else {
                msgDiv.innerHTML =
                    `<span class="pm-user">${user}:</span> ${text} <span class="pm-time">${timeStr}</span>`;
            }
            partyMessagesEl.appendChild(msgDiv);
            partyMessagesEl.scrollTop = partyMessagesEl.scrollHeight;
        }

        function updatePartyUI() {
            if (isInParty) {
                partyCodeDisplay.style.display = 'flex';
                partyCodeValue.textContent = partyCode;
                partyInput.disabled = false;
                partySendBtn.disabled = false;
                createPartyBtn.style.display = 'none';
                joinPartyBtn.style.display = 'none';
                leavePartyBtn.style.display = 'inline-block';
                partyMemberCount.textContent = (partyMembers.length + 1);
            } else {
                partyCodeDisplay.style.display = 'none';
                partyInput.disabled = true;
                partySendBtn.disabled = true;
                createPartyBtn.style.display = 'inline-block';
                joinPartyBtn.style.display = 'inline-block';
                leavePartyBtn.style.display = 'none';
                partyMemberCount.textContent = '0';
                if (broadcastChannel) {
                    broadcastChannel.close();
                    broadcastChannel = null;
                }
            }
        }

        function createParty() {
            partyCode = generatePartyCode();
            isInParty = true;
            partyMembers = [username];

            try {
                broadcastChannel = new BroadcastChannel('party_' + partyCode);
                broadcastChannel.onmessage = (event) => {
                    const data = event.data;
                    if (data.type === 'join') {
                        if (!partyMembers.includes(data.user)) {
                            partyMembers.push(data.user);
                            partyMemberCount.textContent = (partyMembers.length + 1);
                            addPartyMessage(`${data.user} joined!`, 'sys');
                        }
                    } else if (data.type === 'leave') {
                        partyMembers = partyMembers.filter(u => u !== data.user);
                        partyMemberCount.textContent = (partyMembers.length + 1);
                        addPartyMessage(`${data.user} left.`, 'sys');
                    } else if (data.type === 'message') {
                        if (data.user !== username) {
                            addPartyMessage(data.text, 'other', data.user);
                        }
                    }
                };
            } catch (e) {}

            broadcastChannel && broadcastChannel.postMessage({ type: 'join', user: username });

            partyMessagesEl.innerHTML = '';
            addPartyMessage(`🎉 Party created! Code: ${partyCode}`, 'sys');
            addPartyMessage('Share the code for friends to join!', 'sys');
            updatePartyUI();
        }

        function joinParty() {
            const code = prompt('Enter 6-character party code:', '');
            if (code && code.trim().length === 6) {
                partyCode = code.toUpperCase();
                isInParty = true;
                partyMembers = [username];

                try {
                    broadcastChannel = new BroadcastChannel('party_' + partyCode);
                    broadcastChannel.onmessage = (event) => {
                        const data = event.data;
                        if (data.type === 'join') {
                            if (!partyMembers.includes(data.user) && data.user !== username) {
                                partyMembers.push(data.user);
                                partyMemberCount.textContent = (partyMembers.length + 1);
                                addPartyMessage(`${data.user} joined!`, 'sys');
                            }
                        } else if (data.type === 'leave') {
                            partyMembers = partyMembers.filter(u => u !== data.user);
                            partyMemberCount.textContent = (partyMembers.length + 1);
                            addPartyMessage(`${data.user} left.`, 'sys');
                        } else if (data.type === 'message') {
                            if (data.user !== username) {
                                addPartyMessage(data.text, 'other', data.user);
                            }
                        }
                    };
                } catch (e) {}

                broadcastChannel && broadcastChannel.postMessage({ type: 'join', user: username });

                partyMessagesEl.innerHTML = '';
                addPartyMessage(`🔗 Joined party: ${partyCode}`, 'sys');
                updatePartyUI();
            } else if (code) {
                alert('Invalid code. Must be 6 characters.');
            }
        }

        function leaveParty() {
            if (confirm('Leave the party?')) {
                broadcastChannel && broadcastChannel.postMessage({ type: 'leave', user: username });
                isInParty = false;
                partyMessagesEl.innerHTML = '';
                addPartyMessage('🚪 You left the party.', 'sys');
                updatePartyUI();
            }
        }

        function sendPartyMessage() {
            const text = partyInput.value.trim();
            if (!text || !isInParty) return;

            addPartyMessage(text, 'me');
            broadcastChannel && broadcastChannel.postMessage({ type: 'message', user: username, text: text });
            partyInput.value = '';
        }

        createPartyBtn.addEventListener('click', createParty);
        joinPartyBtn.addEventListener('click', joinParty);
        leavePartyBtn.addEventListener('click', leaveParty);
        partySendBtn.addEventListener('click', sendPartyMessage);
        partyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                sendPartyMessage(); } });

        copyCodeBtn.addEventListener('click', () => {
            if (partyCode) {
                navigator.clipboard.writeText(partyCode).then(() => {
                    copyCodeBtn.textContent = '✅';
                    setTimeout(() => { copyCodeBtn.textContent = '📋'; }, 1500);
                }).catch(() => {
                    const textArea = document.createElement('textarea');
                    textArea.value = partyCode;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    copyCodeBtn.textContent = '✅';
                    setTimeout(() => { copyCodeBtn.textContent = '📋'; }, 1500);
                });
            }
        });

        // ============================================
        // SMART AI CHAT
        // ============================================
        const chatMessages2 = document.getElementById('chatMessages');
        const chatInput2 = document.getElementById('chatInput');
        const sendBtn2 = document.getElementById('sendBtn');
        const typingIndicator2 = document.getElementById('typingIndicator');
        const aiStatus2 = document.getElementById('aiStatus');

        function getAIResponse(msg) {
            const m = msg.toLowerCase().trim();

            if (m.includes('write') || m.includes('paragraph') || m.includes('essay') || m.includes('explain') ||
                m.includes('describe') || m.includes('tell me about') || m.includes('what is')) {
                let topic = msg.replace(/write|paragraph|essay|explain|describe|tell me about|what is|a|an|the|for|on|about|with|by|of|to|from|in|at|and|or|but|so|because|if|then|than|that|these|those|this|that|they|them|their|there|its|it|is|are|was|were|have|has|had|do|does|did|will|would|could|should|may|might|must|please|can|you/gi, '')
                    .trim();
                if (!topic || topic.length < 2) topic = "this topic";
                topic = topic.replace(/\b\w/g, l => l.toUpperCase());
                return `📝 **Paragraph on "${topic}"**

${topic} is a fascinating subject that encompasses many important aspects of our world. Understanding ${topic} helps us appreciate the complexity and beauty of the systems and ideas that shape our lives.

The study of ${topic} involves exploring its historical development, current applications, and future implications. Scholars and practitioners continue to make discoveries that expand our knowledge.

${topic} connects to various disciplines including science, technology, arts, and humanities. By exploring ${topic}, we gain insights into fundamental principles that govern our world.

📚 *Would you like me to explore any specific aspect of ${topic} in more detail?*`;
            }

            if (m.includes('hello') || m.includes('hi') || m.includes('hey')) {
                return "👋 Hey there! Ask me to write essays, explain concepts, or help with homework!";
            }
            if (m.includes('joke') || m.includes('funny')) {
                const jokes = [
                    "😂 Why did the student eat his homework? Because the teacher said it was a piece of cake! 🍰",
                    "🤣 What do you call a fake noodle? An impasta! 🍝",
                    "😄 Why did the math book look so sad? Because it had too many problems! 📐"
                ];
                return jokes[Math.floor(Math.random() * jokes.length)];
            }
            if (m.includes('math') || m.includes('algebra') || m.includes('equation')) {
                return "📐 For math help, break problems into steps. What specific topic are you working on?";
            }
            if (m.includes('science') || m.includes('physics') || m.includes('chemistry')) {
                return "🔬 Which science subject: Physics, Chemistry, or Biology? I can explain concepts simply.";
            }
            if (m.includes('history') || m.includes('war') || m.includes('ancient')) {
                return "🏛️ History helps us understand the present! What era or topic are you studying?";
            }
            if (m.includes('thank')) {
                return "😄 You're welcome! Keep up the great work!";
            }

            return "🤔 That's interesting! Tell me more and I'll help. I can write essays, explain concepts, or just chat!";
        }

        function addMessage2(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            div.innerHTML = `${text.replace(/\n/g, '<br>')}<span class="msg-time">${timeStr}</span>`;
            chatMessages2.appendChild(div);
            chatMessages2.scrollTop = chatMessages2.scrollHeight;
        }

        function showTyping2() {
            typingIndicator2.style.display = 'flex';
            aiStatus2.textContent = 'Thinking...';
        }

        function hideTyping2() {
            typingIndicator2.style.display = 'none';
            aiStatus2.textContent = 'Online';
        }

        function handleSend2() {
            const text = chatInput2.value.trim();
            if (!text) return;
            addMessage2(text, 'user');
            chatInput2.value = '';
            showTyping2();
            setTimeout(() => {
                hideTyping2();
                addMessage2(getAIResponse(text), 'bot');
            }, Math.random() * 400 + 200);
        }

        sendBtn2.addEventListener('click', handleSend2);
        chatInput2.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                handleSend2(); } });
    </script>

</body>
</html>
