<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Page</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* Quick styles for the blank page */
        body {
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        .blank-container {
            text-align: center;
            padding: 40px;
        }
        .blank-container h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
            color: #000;
        }
        .blank-container p {
            color: #666;
            font-size: 18px;
        }
        .blank-container .status {
            margin-top: 30px;
            padding: 16px 32px;
            background: #f5f5f5;
            border: 2px solid #000;
            border-radius: 12px;
            display: inline-block;
            font-weight: 500;
        }
        .blank-container .status span {
            color: #00aa00;
        }
    </style>
</head>
<body>
    <div class="blank-container">
        <h1>🚀 Welcome</h1>
        <p>You've successfully unlocked the page.</p>
        <div class="status">
            ✅ Status: <span>Authenticated</span>
        </div>
        <p style="margin-top: 30px; font-size: 14px; color: #999;">
            (We'll add content here next)
        </p>
    </div>
</body>
</html>
